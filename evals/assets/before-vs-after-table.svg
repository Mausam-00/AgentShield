<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#131a33"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e2761"/>
      <stop offset="1" stop-color="#2a3576"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="620" fill="url(#bg)"/>

  <!-- Title -->
  <text x="50" y="60" fill="#ffffff" font-size="30" font-weight="700">AgentShield AI — Token Optimization: Before vs After</text>
  <text x="50" y="90" fill="#8aa0c8" font-size="15">Deterministic 12-task governance workload · engine byte-identical · fully reversible</text>

  <!-- Table -->
  <g transform="translate(50,120)">
    <!-- columns: metric(360) before(180) after(180) change(180) = 900 -->
    <!-- header row -->
    <rect x="0" y="0" width="900" height="52" rx="8" fill="url(#hdr)"/>
    <text x="24" y="33" fill="#cadcfc" font-size="16" font-weight="700">Dimension</text>
    <text x="450" y="33" fill="#cadcfc" font-size="16" font-weight="700" text-anchor="middle">Before</text>
    <text x="630" y="33" fill="#cadcfc" font-size="16" font-weight="700" text-anchor="middle">After</text>
    <text x="810" y="33" fill="#cadcfc" font-size="16" font-weight="700" text-anchor="middle">Change</text>

    <!-- row 1 -->
    <rect x="0" y="60" width="900" height="60" rx="6" fill="#161d38"/>
    <text x="24" y="96" fill="#ffffff" font-size="15">Context tokens (chars/4)</text>
    <text x="450" y="96" fill="#ff9a9a" font-size="17" font-weight="700" text-anchor="middle">244,476</text>
    <text x="630" y="96" fill="#5fe3c0" font-size="17" font-weight="700" text-anchor="middle">162,833</text>
    <text x="810" y="96" fill="#5fe3c0" font-size="16" font-weight="800" text-anchor="middle">−33.4%</text>

    <!-- row 2 -->
    <rect x="0" y="128" width="900" height="60" rx="6" fill="#131a30"/>
    <text x="24" y="164" fill="#ffffff" font-size="15">Relative compute cost (units)</text>
    <text x="450" y="164" fill="#ff9a9a" font-size="17" font-weight="700" text-anchor="middle">196</text>
    <text x="630" y="164" fill="#5fe3c0" font-size="17" font-weight="700" text-anchor="middle">91</text>
    <text x="810" y="164" fill="#5fe3c0" font-size="16" font-weight="800" text-anchor="middle">−53.6%</text>

    <!-- row 3 -->
    <rect x="0" y="196" width="900" height="60" rx="6" fill="#161d38"/>
    <text x="24" y="232" fill="#ffffff" font-size="15">Decision agreement vs baseline</text>
    <text x="450" y="232" fill="#cfe0ff" font-size="17" font-weight="700" text-anchor="middle">12 / 12</text>
    <text x="630" y="232" fill="#cfe0ff" font-size="17" font-weight="700" text-anchor="middle">12 / 12</text>
    <text x="810" y="232" fill="#8aa0c8" font-size="14" font-weight="700" text-anchor="middle">preserved</text>

    <!-- row 4 -->
    <rect x="0" y="264" width="900" height="60" rx="6" fill="#131a30"/>
    <text x="24" y="300" fill="#ffffff" font-size="15">Unsafe actions / approval bypasses</text>
    <text x="450" y="300" fill="#cfe0ff" font-size="17" font-weight="700" text-anchor="middle">0 / 0</text>
    <text x="630" y="300" fill="#cfe0ff" font-size="17" font-weight="700" text-anchor="middle">0 / 0</text>
    <text x="810" y="300" fill="#8aa0c8" font-size="14" font-weight="700" text-anchor="middle">preserved</text>

    <!-- row 5 -->
    <rect x="0" y="332" width="900" height="60" rx="6" fill="#161d38"/>
    <text x="24" y="368" fill="#ffffff" font-size="15">Min critical-fact retention</text>
    <text x="450" y="368" fill="#cfe0ff" font-size="17" font-weight="700" text-anchor="middle">1.0</text>
    <text x="630" y="368" fill="#cfe0ff" font-size="17" font-weight="700" text-anchor="middle">1.0</text>
    <text x="810" y="368" fill="#8aa0c8" font-size="14" font-weight="700" text-anchor="middle">preserved</text>

    <!-- highlight strip -->
    <rect x="0" y="410" width="900" height="66" rx="8" fill="#12261f" stroke="#22d3aa" stroke-width="1.5"/>
    <text x="24" y="443" fill="#5fe3c0" font-size="16" font-weight="700">Net result</text>
    <text x="24" y="465" fill="#9fb2d6" font-size="12.5">One-third fewer tokens and roughly half the relative cost — with zero safety trade-off.</text>
    <text x="876" y="452" fill="#ffffff" font-size="26" font-weight="800" text-anchor="end">−33.4% tokens · −53.6% cost</text>
  </g>

  <text x="50" y="600" fill="#5b6a8f" font-size="11.5">Tokens approximated as chars/4 (not provider-exact) · cost is a labelled relative model (premium 4× economy) · no invented metrics.</text>
</svg>
