<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#131a33"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#ff8e53"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3aa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="0.5" stop-color="#f5c451"/>
      <stop offset="1" stop-color="#22d3aa"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="64" fill="#ffffff" font-size="34" font-weight="700">AgentShield AI — Token Utilization Architecture</text>
  <text x="60" y="94" fill="#8aa0c8" font-size="17">Deterministic governance preserved · optimization measured &amp; reversible · 12-task workload</text>

  <!-- ============ PIPELINE ============ -->
  <g transform="translate(60,150)">
    <rect width="200" height="110" rx="14" fill="#1c2340" stroke="url(#hot)" stroke-width="2"/>
    <text x="100" y="34" text-anchor="middle" fill="#ff8e8e" font-size="15" font-weight="600">BASELINE</text>
    <text x="100" y="72" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="800">244,476</text>
    <text x="100" y="94" text-anchor="middle" fill="#8aa0c8" font-size="12">context tokens</text>
  </g>

  <line x1="260" y1="205" x2="1020" y2="205" stroke="#26304f" stroke-width="26" stroke-linecap="round"/>
  <line x1="260" y1="205" x2="1020" y2="205" stroke="url(#pipe)" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <g>
    <circle r="6" fill="#ffd27a">
      <animateMotion dur="3s" repeatCount="indefinite" path="M260,205 L1020,205"/>
      <animate attributeName="r" values="6;6;3;2" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#ff6b6b;#f5c451;#22d3aa;#22d3aa" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#ffd27a">
      <animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M260,205 L1020,205"/>
      <animate attributeName="r" values="6;6;3;2" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#ff6b6b;#f5c451;#22d3aa;#22d3aa" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#ffd27a">
      <animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M260,205 L1020,205"/>
      <animate attributeName="r" values="6;6;3;2" dur="3s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#ff6b6b;#f5c451;#22d3aa;#22d3aa" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#ffffff" font-size="12.5" text-anchor="middle">
    <g transform="translate(300,150)">
      <rect width="150" height="110" rx="12" fill="#182036" stroke="#33507a" stroke-width="1.5"/>
      <text x="75" y="26" fill="#7fd7ff" font-weight="700">PHASE 2</text>
      <text x="75" y="46" fill="#9fb2d6" font-size="11">dedup · contracts</text>
      <text x="75" y="62" fill="#9fb2d6" font-size="11">scoped retrieval</text>
      <text x="75" y="86" fill="#ffffff" font-size="20" font-weight="800">167,433</text>
      <text x="75" y="102" fill="#ff9a76" font-size="11" font-weight="700">−31.5%</text>
    </g>
    <g transform="translate(480,150)">
      <rect width="150" height="110" rx="12" fill="#182036" stroke="#33507a" stroke-width="1.5"/>
      <text x="75" y="26" fill="#7fd7ff" font-weight="700">PHASE 3</text>
      <text x="75" y="46" fill="#9fb2d6" font-size="11">memory pointers</text>
      <text x="75" y="62" fill="#9fb2d6" font-size="11">compaction</text>
      <text x="75" y="86" fill="#ffffff" font-size="20" font-weight="800">162,833</text>
      <text x="75" y="102" fill="#ffb56b" font-size="11" font-weight="700">−33.4%</text>
    </g>
    <g transform="translate(660,150)">
      <rect width="150" height="110" rx="12" fill="#182036" stroke="#2f5f52" stroke-width="1.5"/>
      <text x="75" y="26" fill="#5fe3c0" font-weight="700">PHASE 4</text>
      <text x="75" y="46" fill="#9fb2d6" font-size="11">routing · caching</text>
      <text x="75" y="62" fill="#9fb2d6" font-size="11">subagents</text>
      <text x="75" y="86" fill="#ffffff" font-size="20" font-weight="800">162,833</text>
      <text x="75" y="102" fill="#5fe3c0" font-size="11" font-weight="700">cost −53.6%</text>
    </g>
    <g transform="translate(840,150)">
      <rect width="150" height="110" rx="12" fill="#182036" stroke="#2f5f52" stroke-width="1.5"/>
      <text x="75" y="26" fill="#5fe3c0" font-weight="700">PHASE 5</text>
      <text x="75" y="46" fill="#9fb2d6" font-size="11">token budget</text>
      <text x="75" y="62" fill="#9fb2d6" font-size="11">governance STOP</text>
      <text x="75" y="86" fill="#ffffff" font-size="20" font-weight="800">162,833</text>
      <text x="75" y="102" fill="#5fe3c0" font-size="11" font-weight="700">−33.4%</text>
    </g>
  </g>

  <g transform="translate(1020,150)">
    <rect width="200" height="110" rx="14" fill="#12261f" stroke="url(#cool)" stroke-width="2">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="100" y="34" text-anchor="middle" fill="#5fe3c0" font-size="15" font-weight="600">OPTIMIZED</text>
    <text x="100" y="72" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="800">162,833</text>
    <text x="100" y="94" text-anchor="middle" fill="#8aa0c8" font-size="12">context tokens</text>
  </g>

  <!-- ============ BEFORE vs AFTER BARS ============ -->
  <g transform="translate(60,320)">
    <text x="0" y="0" fill="#ffffff" font-size="20" font-weight="700">Before vs After</text>

    <text x="0" y="46" fill="#9fb2d6" font-size="13">Context tokens</text>
    <rect x="150" y="30" width="620" height="22" rx="6" fill="#26304f"/>
    <rect x="150" y="30" width="10" height="22" rx="6" fill="url(#hot)">
      <animate attributeName="width" from="10" to="620" dur="1.4s" fill="freeze"/>
    </rect>
    <text x="784" y="47" fill="#ff9a9a" font-size="13" font-weight="700">244,476</text>
    <rect x="150" y="60" width="10" height="22" rx="6" fill="url(#cool)">
      <animate attributeName="width" from="10" to="413" dur="1.4s" begin="0.3s" fill="freeze"/>
    </rect>
    <text x="784" y="77" fill="#5fe3c0" font-size="13" font-weight="700">162,833  (−33.4%)</text>

    <text x="0" y="126" fill="#9fb2d6" font-size="13">Relative compute cost</text>
    <rect x="150" y="110" width="620" height="22" rx="6" fill="#26304f"/>
    <rect x="150" y="110" width="10" height="22" rx="6" fill="url(#hot)">
      <animate attributeName="width" from="10" to="620" dur="1.4s" fill="freeze"/>
    </rect>
    <text x="784" y="127" fill="#ff9a9a" font-size="13" font-weight="700">196 units</text>
    <rect x="150" y="140" width="10" height="22" rx="6" fill="url(#cool)">
      <animate attributeName="width" from="10" to="288" dur="1.4s" begin="0.3s" fill="freeze"/>
    </rect>
    <text x="784" y="157" fill="#5fe3c0" font-size="13" font-weight="700">91 units  (−53.6%)</text>
  </g>

  <!-- ============ PRESERVED SAFETY ============ -->
  <g transform="translate(900,320)">
    <rect x="0" y="10" width="320" height="182" rx="14" fill="#141b33" stroke="#2a3557" stroke-width="1.5"/>
    <text x="20" y="42" fill="#ffffff" font-size="16" font-weight="700">Preserved (unchanged)</text>
    <g font-size="13">
      <circle cx="30" cy="72" r="7" fill="#22d3aa"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></circle>
      <text x="48" y="77" fill="#cfe0ff">Decision agreement  12 / 12</text>
      <circle cx="30" cy="102" r="7" fill="#22d3aa"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.3s" repeatCount="indefinite"/></circle>
      <text x="48" y="107" fill="#cfe0ff">Unsafe actions / bypass  0 / 0</text>
      <circle cx="30" cy="132" r="7" fill="#22d3aa"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.6s" repeatCount="indefinite"/></circle>
      <text x="48" y="137" fill="#cfe0ff">Critical-fact retention  1.0</text>
      <circle cx="30" cy="162" r="7" fill="#22d3aa"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.9s" repeatCount="indefinite"/></circle>
      <text x="48" y="167" fill="#cfe0ff">Engine byte-identical</text>
    </g>
  </g>

  <!-- ============ SOURCE OF SAVINGS ============ -->
  <g transform="translate(60,540)">
    <text x="0" y="0" fill="#ffffff" font-size="18" font-weight="700">Where the savings come from</text>
    <g font-size="12.5" fill="#9fb2d6">
      <g transform="translate(0,26)">
        <rect width="250" height="120" rx="10" fill="#161d38" stroke="#2a3557"/>
        <text x="16" y="30" fill="#7fd7ff" font-weight="700" font-size="13">Gate-specific tools</text>
        <text x="16" y="56">Load only tools a gate uses</text>
        <text x="16" y="76">vs full ~1,976-token surface</text>
        <rect x="16" y="90" width="0" height="8" rx="4" fill="url(#cool)"><animate attributeName="width" from="0" to="218" dur="1.6s" fill="freeze"/></rect>
      </g>
      <g transform="translate(270,26)">
        <rect width="250" height="120" rx="10" fill="#161d38" stroke="#2a3557"/>
        <text x="16" y="30" fill="#7fd7ff" font-weight="700" font-size="13">Loop limits + shared ctx</text>
        <text x="16" y="56">No full reload per delegate</text>
        <text x="16" y="76" fill="#5fe3c0" font-weight="700">task_06  −77.6%</text>
        <rect x="16" y="90" width="0" height="8" rx="4" fill="url(#cool)"><animate attributeName="width" from="0" to="218" dur="1.6s" begin="0.2s" fill="freeze"/></rect>
      </g>
      <g transform="translate(540,26)">
        <rect width="250" height="120" rx="10" fill="#161d38" stroke="#2a3557"/>
        <text x="16" y="30" fill="#7fd7ff" font-weight="700" font-size="13">Scoped retrieval</text>
        <text x="16" y="56">Top-k sections, not whole</text>
        <text x="16" y="76" fill="#5fe3c0" font-weight="700">task_05  −31.2%</text>
        <rect x="16" y="90" width="0" height="8" rx="4" fill="url(#cool)"><animate attributeName="width" from="0" to="218" dur="1.6s" begin="0.4s" fill="freeze"/></rect>
      </g>
      <g transform="translate(810,26)">
        <rect width="250" height="120" rx="10" fill="#161d38" stroke="#2a3557"/>
        <text x="16" y="30" fill="#7fd7ff" font-weight="700" font-size="13">Compaction + pointers</text>
        <text x="16" y="56">Validated summary; audit store</text>
        <text x="16" y="76" fill="#5fe3c0" font-weight="700">task_12 −38.1% · task_03 −21.8%</text>
        <rect x="16" y="90" width="0" height="8" rx="4" fill="url(#cool)"><animate attributeName="width" from="0" to="218" dur="1.6s" begin="0.6s" fill="freeze"/></rect>
      </g>
    </g>
  </g>

  <text x="60" y="706" fill="#5b6a8f" font-size="11">Tokens approximated as chars/4 (not provider-exact) · cost is a labelled relative model · deduplication found 0 duplicate blocks (no savings claimed)</text>
</svg>
