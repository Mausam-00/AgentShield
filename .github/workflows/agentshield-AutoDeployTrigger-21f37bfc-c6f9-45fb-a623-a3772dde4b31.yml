name: Trigger auto deployment for agentshield

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/agentshield-AutoDeployTrigger-21f37bfc-c6f9-45fb-a623-a3772dde4b31.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AGENTSHIELD_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AGENTSHIELD_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AGENTSHIELD_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: agentshieldpacr2026.azurecr.io
          registryUsername: ${{ secrets.AGENTSHIELD_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AGENTSHIELD_REGISTRY_PASSWORD }}
          containerAppName: agentshield
          resourceGroup: rg-agentshield
          imageToBuild: agentshieldpacr2026.azurecr.io/agentshield:${{ github.sha }}
          targetPort: 3000
          ingress: external

      # Re-assert the LLM-enrichment environment declaratively on every deploy so
      # an image update can never silently drop it (which would make the website
      # cache-miss and diverge from the CLI report). AZURE_AI_KEY references the
      # pre-existing `azure-ai-key` Container App secret, so no secret value is
      # ever placed in this workflow. The az session is provided by the Azure
      # Login step above.
      - name: Ensure LLM enrichment env vars (declarative)
        run: |
          az containerapp update \
            --name agentshield \
            --resource-group rg-agentshield \
            --container-name agentshield \
            --set-env-vars \
              AZURE_AI_ENDPOINT=https://agentshield-ai.services.ai.azure.com \
              AZURE_AI_MODEL=gpt-oss-120b \
              AZURE_AI_KEY=secretref:azure-ai-key


