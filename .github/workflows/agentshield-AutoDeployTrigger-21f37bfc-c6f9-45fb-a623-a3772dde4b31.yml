name: Trigger auto deployment for agentshield

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/agentshield-AutoDeployTrigger-21f37bfc-c6f9-45fb-a623-a3772dde4b31.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AGENTSHIELD_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AGENTSHIELD_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AGENTSHIELD_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}Dockerfile
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: agentshieldpacr2026.azurecr.io
          registryUsername: ${{ secrets.AGENTSHIELD_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AGENTSHIELD_REGISTRY_PASSWORD }}
          containerAppName: agentshield
          resourceGroup: rg-agentshield
          imageToBuild: agentshieldpacr2026.azurecr.io/agentshield:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


